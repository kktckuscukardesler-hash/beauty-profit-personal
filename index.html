</div></fieldset></div>
<button type="button" class="bp-signup-primary" @click="card.minutes = hours*60 + mins; $refs.timeSheet.close()">Готово</button></dialog>
<div class="bp-pair"><label>Цена<input v-model.trim="card.price" inputmode="decimal" pattern="[0-9]+([.,][0-9]{1,2})?" required placeholder="0,00"></label><div class="bp-currency-field"><span>Валюта</span><button type="button" aria-haspopup="dialog" @click="currencyQuery=''; $refs.currencySheet.showModal()">{{card.currency}} ⌄</button></div></div><dialog ref="currencySheet" class="bp-time-sheet" aria-labelledby="bp-currency-title"><header><h2 id="bp-currency-title">Валюта услуги</h2><button type="button" class="bp-sheet-close" aria-label="Закрыть" @click="$refs.currencySheet.close()">×</button></header>

<header><button type="button" aria-label="Закрыть" @click="$refs.mediaSheet.close()">×</button><h2 id="bp-media-title">Фото и описание услуги</h2></header>
<div class="bp-media-content">
<textarea v-model="card.description" rows="5" aria-label="Описание услуги" placeholder="Описание услуги"></textarea>
<div class="bp-media-heading"><h3>Фотографии</h3></div>
<div class="bp-media-grid">
<div class="bp-media-thumb" v-for="(photo,index) in card.photos" :key="index"><img :src="photo" :alt="'Фото услуги '+(index+1)"><button type="button" :aria-label="'Удалить фото '+(index+1)" @click="card.photos.splice(index,1)">×</button></div>
<button class="bp-media-add" type="button" aria-label="Добавить фотографии" :disabled="photoBusy" @click="$refs.mediaInput.click()">{{ photoBusy ? '…' : '+' }}</button>
<input ref="mediaInput" hidden type="file" accept="image/*" multiple @change="cardPhoto">
</div><p v-if="mediaError" role="alert">{{mediaError}}</p>
</div>
<div class="bp-media-done"><button type="button" class="bp-signup-primary" :disabled="photoBusy" @click="$refs.mediaSheet.close()">{{ photoBusy ? 'Загружаем фото…' : 'Готово' }}</button></div>
</dialog>
<p v-if="cardError" role="alert">{{cardError}}</p>
<button type="submit" class="bp-signup-primary" :disabled="photoBusy">{{serviceEdit.selected ? 'Сохранить изменения' : 'Создать услугу'}}</button>
<button v-if="serviceEdit.selected" type="button" class="bp-signup-category" @click="finishCard(false)">Убрать из выбранных</button></form>
          <div v-else-if="signupStep===1" class="bp-signup-form bp-plan-step">
            <h1>Выберите тариф</h1>
            <p>Калькулятор бесплатный всегда. Тариф можно сменить в любой момент.</p>
            <div class="bp-plan-list" role="radiogroup" aria-label="Тарифы">
              <button v-for="pl in signupPlans" :key="pl.id" type="button" role="radio" :aria-checked="signupPlan===pl.id" class="bp-plan-card" :class="{selected: signupPlan===pl.id}" @click="signupPlan=pl.id">
                <span class="bp-plan-head"><span class="bp-plan-name">{{ pl.name }} <em v-if="pl.popular" class="bp-plan-badge">Популярный</em></span><span class="bp-plan-radio" aria-hidden="true"></span></span>
                <span class="bp-plan-price"><b>{{ pl.price }}</b> <small>{{ pl.period }}</small></span>
                <span class="bp-plan-sub">{{ pl.sub }}</span>
                <span class="bp-plan-feats"><span v-for="ft in pl.features" :key="ft" class="bp-plan-feat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>{{ ft }}</span></span>
              </button>
            </div>
            <div class="bp-signup-bottom"><button type="button" class="bp-signup-primary" @click="signupNext">{{ signupPlanInfo().cta }}</button></div>
          </div>
          <form v-else-if="signupStep===2" class="bp-signup-form" @submit.prevent="signupNext">
            <h1>Как вас зовут?</h1>
            <label class="bp-signup-visually-hidden" for="bp-signup-name">Ваше имя</label>
            <input id="bp-signup-name" v-model.trim="signupName" autocomplete="given-name" enterkeyhint="next" placeholder="Ваше имя" maxlength="80">
            <div class="bp-signup-bottom"><button type="submit" class="bp-signup-primary" :disabled="!signupName.trim()">Продолжить</button></div>
          </form>
          <div v-else-if="signupStep===3" class="bp-signup-form">
            <h1>{{ signupName }}, выберите виды деятельности</h1>
            <p class="bp-signup-help">Выберите всё, чем вы занимаетесь.</p>
            <div class="bp-signup-list">
              <button v-for="category in signupCategories" :key="category" type="button" class="bp-signup-category" :class="{selected:signupSelected.includes(category)}" :aria-pressed="signupSelected.includes(category)" @click="signupToggle(category)"><span>{{ category }}</span><span class="bp-signup-symbol" aria-hidden="true">{{ signupSelected.includes(category) ? '✓' : '+' }}</span></button>
              <button type="button" class="bp-signup-category bp-signup-custom" @click="signupAdding=!signupAdding"><span class="bp-signup-symbol" aria-hidden="true">+</span><span>Добавить свою категорию</span></button>
              <form v-if="signupAdding" class="bp-signup-add" @submit.prevent="signupAdd"><label class="bp-signup-visually-hidden" for="bp-signup-custom">Название категории</label><input id="bp-signup-custom" v-model.trim="signupCustom" maxlength="60" placeholder="Название категории" enterkeyhint="done"><button type="submit" :disabled="!signupCustom.trim()">Добавить</button></form>
            </div>
            <div v-if="signupPlanTooSmall()" class="bp-plan-warn" role="alert">В тарифе «Мастер» можно выбрать до двух видов деятельности. Оставьте два вида или смените тариф.<button type="button" @click="signupStep=1;signupScroll()">Изменить тариф</button></div>
            <div class="bp-signup-bottom"><button type="button" class="bp-signup-primary" :disabled="!signupSelected.length || signupPlanTooSmall()" @click="signupNext">Продолжить<span v-if="signupSelected.length"> · {{ signupSelected.length }}</span></button></div>
          </div>
          <div v-else-if="signupStep===4" class="bp-signup-form">
            <h1>Выберите услуги</h1>
            <div class="bp-service-tabs" role="group" aria-label="Виды деятельности">
              <button v-for="category in orderedSignupCategories" :key="category" type="button" :aria-pressed="category === serviceCategory" @click="openServiceCategory(category)">{{ category }}</button>
            </div>
            <button v-for="service in servicesFor(serviceCategory)" :key="service.name" type="button" class="bp-signup-category bp-service-row" :class="{selected: service.selected}" :aria-pressed="service.selected" @click="editCard(service)">
              <span>{{ service.name }}</span><span class="bp-signup-symbol" aria-hidden="true">{{ service.selected ? '✓' : '+' }}</span>
            </button>
            <button type="button" class="bp-signup-category bp-service-row" @click="addingService = !addingService">Добавить свою услугу <span class="bp-signup-symbol" aria-hidden="true">+</span></button>
            <form v-if="addingService" class="bp-signup-add" @submit.prevent="addService">
              <label class="bp-signup-visually-hidden" for="bp-service-name">Название услуги</label>
              <input id="bp-service-name" v-model="serviceDraft" maxlength="80" placeholder="Название услуги">
              <button type="submit" :disabled="!serviceDraft.trim()">Добавить</button>
            </form>
            <div class="bp-signup-bottom"><button type="button" class="bp-signup-primary" @click="signupNext">{{ serviceOptions.some(s => s.selected && signupSelected.includes(s.category)) ? 'Продолжить' : 'Выбрать услуги позже' }}</button></div>
          </div>
          <div v-else-if="signupStep===5" class="bp-signup-form bp-client-step">
            <template v-if="!clientEntry">
              <div class="bp-client-intro">
                <div class="bp-client-art" aria-hidden="true"><i>К</i><i>Е</i><i>Л</i><b><svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="14" cy="10" r="4"/><path d="M5 26v-2a9 9 0 0 1 18 0v2zM22 6a4 4 0 0 1 0 8m3 4a7 7 0 0 1 4 7"/></svg></b><i>А</i><i>П</i><i>З</i></div>
                <h1>Добавьте своих клиентов</h1><p>Вы сможете записывать клиентов на сеансы и находить их контакты в личном кабинете.</p>
              </div>
              <div class="bp-signup-bottom"><button type="button" class="bp-signup-primary" @click="clientEntry=true">Добавить моих клиентов</button><button type="button" class="bp-client-skip" @click="signupNext">Пропустить</button></div>
            </template>
            <template v-else>
              <h1>Добавьте клиентов</h1>
              <label v-if="clientChoices.length" class="bp-client-fields"><input v-model.trim="clientQuery" type="search" placeholder="Поиск клиентов" aria-label="Поиск клиентов"></label>
              <div class="bp-contact-list"><label v-for="c in visibleContacts" :key="JSON.stringify([c.name,c.phone])" class="bp-contact-row">
                <span aria-hidden="true" class="bp-contact-avatar">{{c.name.slice(0,1).toLocaleUpperCase()}}</span>
                <span>{{c.name}}<small v-if="c.phone">{{c.phone}}</small></span>
                <input type="checkbox" v-model="c.selected">
              </label></div>
              <p v-if="clientChoices.length && !visibleContacts.length">Совпадений нет</p>
              <button v-if="canPickContacts" class="bp-signup-category" type="button" @click="pickContacts">Выбрать из контактов телефона</button>
              <button type="button" class="bp-client-skip" @click="manualClient=!manualClient">Добавить вручную</button>
              <form v-if="manualClient" class="bp-client-fields" @submit.prevent="saveSignupClient">
                <label>Имя клиента<input v-model.trim="clientName" required></label>
                <label>Телефон (по желанию)<input v-model.trim="clientPhone" type="tel"></label>
                <button type="submit" class="bp-signup-primary" :disabled="!clientName">Добавить в список</button>
              </form>
              <p role="status">{{clientNotice}}</p>
              <div class="bp-signup-bottom"><button class="bp-signup-primary" type="button" @click="confirmClients">{{clientChoices.some(c => c.selected) ? 'Добавить выбранных · ' + clientChoices.filter(c => c.selected).length : 'Пропустить'}}</button></div>
            </template>
          </div>
          <div v-else-if="signupStep===6" class="bp-signup-form bp-client-step">
            <div class="bp-client-intro">
              <div class="bp-reminder-preview" aria-label="Пример уведомления"><span aria-hidden="true">BP</span><div><strong>Beauty Profit</strong><br>Напомните клиенту о записи сегодня в 14:30</div></div>
              <h1>Не пропустите напоминания</h1>
              <p>Разрешите уведомления о предстоящих визитах и новых заявках на онлайн-запись.</p>
            </div>
            <div class="bp-signup-bottom">
              <p v-if="notificationNotice" role="status">{{notificationNotice}}</p>
              <button class="bp-signup-primary" type="button" :disabled="askingNotifications" @click="requestSignupNotifications">Разрешить уведомления</button>
              <button class="bp-client-skip" type="button" @click="signupNext">Настроить позже</button>
            </div>
          </div>
          <form v-else-if="signupStep===7" class="bp-signup-form bp-phone-step" @submit.prevent="signupPhoneSubmit">
            <h1>Зарегистрируйтесь, чтобы не потерять данные</h1>
            <p>Укажите телефон, почту и пароль, чтобы не потерять доступ к своей странице.</p>
            <div class="bp-phone-row">
              <button type="button" class="bp-phone-country" :aria-label="'Код страны: '+signupCountryInfo().name+' +'+signupCountryInfo().code" @click="openCountryPicker"><span aria-hidden="true">{{ signupCountryInfo().flag }}</span> +{{ signupCountryInfo().code }} <span aria-hidden="true">›</span></button>
              <label class="bp-signup-visually-hidden" for="bp-signup-phone">Номер телефона</label>
              <input id="bp-signup-phone" v-model="signupPhone" type="tel" inputmode="tel" autocomplete="tel-national" enterkeyhint="done" placeholder="Номер телефона" maxlength="20">
            </div>
            <label class="bp-signup-visually-hidden" for="bp-signup-email">Электронная почта</label>
            <input id="bp-signup-email" class="bp-auth-field" v-model.trim="signupEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="Электронная почта" maxlength="120" @input="signupAccountError=''">
            <div class="bp-pass-wrap">
              <label class="bp-signup-visually-hidden" for="bp-signup-pass">Пароль</label>
              <input id="bp-signup-pass" class="bp-auth-field" v-model="signupPass" :type="signupShowPass ? 'text' : 'password'" autocomplete="new-password" placeholder="Придумайте пароль" maxlength="100">
              <button type="button" class="bp-pass-toggle" :aria-label="signupShowPass ? 'Скрыть пароль' : 'Показать пароль'" @click="signupShowPass=!signupShowPass">{{ signupShowPass ? 'Скрыть' : 'Показать' }}</button>
            </div>
            <p class="bp-pass-hint">Почта и пароль — для входа в следующий раз. Пароль не короче 6 символов.</p>
            <p v-if="signupAccountError" class="bp-phone-notice" role="alert">{{ signupAccountError }}</p>
            <button type="submit" class="bp-signup-primary" :disabled="!signupFormOk()">Продолжить</button>
            <div class="bp-phone-or"><span>или</span></div>
            <button type="button" class="bp-auth-provider bp-auth-apple" @click="signupProvider('Apple')"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.7-1-2.7-4.1zM13.9 5c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.1.1 2.3-.6 3-1.5z"/></svg>Продолжить с Apple</button>
            <button type="button" class="bp-auth-provider bp-auth-google" @click="signupProvider('Google')"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9c-.3 1.4-1 2.5-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8C3.9 20.6 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.8 14.2c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2V7H2.1C1.4 8.5 1 10.2 1 12s.4 3.5 1.1 5l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.5 2.1 15 1 12 1 7.7 1 3.9 3.4 2.1 7l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>Продолжить с Google</button>
            <p v-if="signupAuthNotice" class="bp-phone-notice" role="status">{{ signupAuthNotice }}</p>
            <button type="button" class="bp-client-skip bp-phone-login" @click="welcomeAuth('login')">У меня уже есть аккаунт</button>
            <p class="bp-phone-terms">Продолжая, вы соглашаетесь с условиями пользовательского соглашения, политикой конфиденциальности и даёте согласие на обработку персональных данных.</p>
            <dialog ref="countrySheet" class="bp-country" aria-labelledby="bp-country-title" @close="countryQuery=''">
              <header><button type="button" aria-label="Закрыть" @click="$refs.countrySheet.close()">×</button><h2 id="bp-country-title">Код страны</h2></header>
              <div class="bp-country-search"><input ref="countrySearch" v-model="countryQuery" type="search" placeholder="Страна или код" aria-label="Поиск страны"></div>
              <ul class="bp-country-list">
                <li v-for="c in filteredCountries()" :key="c.iso"><button type="button" :class="{selected:c.iso===signupCountry}" @click="pickCountry(c.iso)"><span aria-hidden="true">{{ c.flag }}</span><span class="bp-country-name">{{ c.name }}</span><span class="bp-country-code">+{{ c.code }}</span></button></li>
                <li v-if="!filteredCountries().length" class="bp-country-empty">Ничего не найдено</li>
              </ul>
            </dialog>
          </form>
          <div v-else class="bp-signup-form">
            <h1>Отлично, {{ signupName }}!</h1>
            <p v-if="user && user.email && user.email.indexOf('@')>0" class="bp-signup-help">Почта для входа: {{ user.email }}</p>
            <p v-if="signupPhoneFull" class="bp-signup-help">Телефон: {{ signupPhoneFull }}</p>
            <p class="bp-signup-help">Тариф: {{ signupPlanInfo().name }} — {{ signupPlanInfo().price }} {{ signupPlanInfo().period }}</p>
            <p class="bp-signup-help">Вы выбрали следующие виды деятельности:</p>
            <div class="bp-signup-list"><div v-for="category in orderedSignupCategories" :key="category" class="bp-signup-category selected"><span>{{ category }}<small class="bp-service-summary">{{ servicesFor(category).filter(s => s.selected).map(s => s.name + (s.details ? ' · ' + [durationText(s.details.minutes), (s.details.from ? 'от ' : '') + s.details.price + ' ' + s.details.currency].filter(Boolean).join(' · ') : '')).join(', ') }}</small></span><span class="bp-signup-symbol">✓</span></div></div>
            <p class="bp-signup-note">Аккаунт сохранён на этом устройстве: в следующий раз войдите по почте и паролю через «У меня есть аккаунт». Оплата и сервер пока не подключены.</p>
            <div class="bp-signup-bottom"><button type="button" class="bp-signup-primary" @click="signupFinish">Перейти в кабинет</button><button type="button" class="bp-client-skip" @click="signupBack">Изменить выбор</button></div>
          </div>
        </div>
      </Transition>
    </div></section>
  </template>
  <template v-if="view === 'welcomeAuth'">

  <template v-if="view === 'setup'">

  <template v-if="view === 'loading'">

  <template v-if="view === 'landing'">

  <template v-if="view === 'auth'">

          <label v-if="auth.mode === 'signup'" style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700">Как вас зовут

          </label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700">Почта

            <input class="bpc-auth-input" v-model="auth.pass" type="password" :autocomplete="auth.mode === 'signup' ? 'new-password' : 'current-password'" placeholder="Минимум 6 символов">
          </label>
          <div v-if="auth.err" role="alert" style="background:#FDF1EF;color:#9B2C20;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700">{{ auth.err }}</div>
          <div v-if="auth.msg" role="status" style="background:#EFF7EF;color:#1C6B30;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700">{{ auth.msg }}</div>
          <button class="bpc-btn" type="submit" :disabled="auth.busy">{{ auth.busy ? 'Подождите…' : (auth.mode === 'signup' ? 'Зарегистрироваться' : 'Войти') }}</button>
        </form>
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px">
          <button type="button" class="bpc-link" @click="auth.mode = auth.mode === 'signup' ? 'login' : 'signup'; auth.err = ''; auth.msg = ''">{{ auth.mode === 'signup' ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Регистрация' }}</button>
          <button v-if="auth.mode === 'login'" type="button" class="bpc-link" @click="forgot">Забыли пароль?</button>
        </div>
        <button type="button" class="bpc-link" style="align-self:flex-start;color:#776A71" @click="toSite">← На главную</button>
      </div>
    </div>
  </template>

  <template v-if="view === 'newpass'">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box">
      <form @submit.prevent="saveNewPass" style="width:100%;max-width:420px;background:#FFFFFF;border:1px solid #EAE3E7;border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;gap:14px">
        <h1 style="margin:0;font-family:Lato,Arial,sans-serif;font-size:22px">Новый пароль</h1>
        <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700">Придумайте пароль

        </label>
        <div v-if="newPass.err" role="alert" style="background:#FDF1EF;color:#9B2C20;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700">{{ newPass.err }}</div>
        <button class="bpc-btn" type="submit" :disabled="newPass.busy">Сохранить и войти</button>
      </form>
    </div>
  </template>

  <template v-if="view === 'paywall'">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box">
      <div style="width:100%;max-width:720px;background:#FFFFFF;border:1px solid #EAE3E7;border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;gap:16px">
        <h1 style="margin:0;font-family:Lato,Arial,sans-serif;font-size:24px">Пробный период закончился</h1>
        <p style="margin:0;font-size:16px;line-height:1.55;color:#554A50">Все ваши данные сохранены. Выберите тариф, чтобы продолжить работу.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
          <div style="border: 1px solid #EAE3E7;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px">
            <div style="font-family:Lato,Arial,sans-serif;font-weight:700;font-size:18px">Plus</div>
            <div style="font-size:28px;font-weight: 700">$4,99 <span style="font-size:14px;color:#776A71;font-weight:600">/ месяц</span></div>
            <div style="font-size:14px;color:#554A50">До двух видов деятельности</div>
            <a v-if="payUrl('plus')" class="bpc-btn" :href="payUrl('plus')" target="_blank" rel="noopener" style="text-decoration:none;text-align:center;background:#FFFFFF;color:#8E2F56;border: 1px solid #8E2F56;box-sizing:border-box;display:flex;align-items:center;justify-content:center">Оплатить Plus</a>
          </div>
          <div style="border: 1px solid #8E2F56;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px">
            <div style="font-family:Lato,Arial,sans-serif;font-weight:700;font-size:18px">Premium</div>
            <div style="font-size:28px;font-weight: 700">$19,99 <span style="font-size:14px;color:#776A71;font-weight:600">/ 6 месяцев</span></div>
            <div style="font-size:14px;color:#554A50">Все виды деятельности без ограничений</div>
            <a v-if="payUrl('premium')" class="bpc-btn" :href="payUrl('premium')" target="_blank" rel="noopener" style="text-decoration:none;text-align:center;box-sizing:border-box;display:flex;align-items:center;justify-content:center">Оплатить Premium</a>
          </div>
        </div>
        <p style="margin:0;font-size:14px;color:#776A71">После оплаты доступ откроется автоматически или в течение нескольких часов.<span v-if="contact"> Вопросы: {{ contact }}</span></p>

          <button type="button" class="bpc-link" @click="onSession({ user: user })">Я оплатила — проверить доступ</button>
          <button type="button" class="bpc-link" style="color:#776A71" @click="logout">Выйти</button>
        </div>
      </div>
    </div>
  </template>

  <div v-if="view !== 'welcome' && view !== 'welcomeAuth' && view !== 'signupSteps'" style="background:#F3E6EC;color:#6B1F40;text-align:center;padding:8px 12px;font-size:12px;font-weight:600">Личная демоверсия · данные только на этом устройстве · без связи с общим сайтом</div>
  <template v-if="view === 'app'">
    <bpc-app :key="'a' + appKey" :chosen="chosen" :plan="planId" :saved="saved" :fresh="!!(cab && cab.fresh)" :on-back="toSite" :on-logout="logout" :on-state="onAppState" :email="user ? user.email : ''" :plan-note="planNote"></bpc-app>
    <div v-if="serviceEdit && cabCardCb" class="bp-cab-card-overlay"><section class="bp-intro bp-signup"><div class="bp-signup-inner"><header class="bp-signup-top"><button class="bp-signup-back" type="button" @click="closeCabinetCard" aria-label="Назад">←</button></header><div class="bp-signup-content"><form v-if="serviceEdit" class="bp-signup-form bp-card-editor" @submit.prevent="finishCard(true)">
<h1>{{ serviceEdit.selected ? 'Настройки услуги' : 'Новая услуга' }}</h1>
<p>{{ serviceEdit.category }}</p><h2>{{ serviceEdit.name }}</h2>
<button type="button" class="bp-signup-category" @click="showTime">Продолжительность <span>{{ card.minutes ? durationText(card.minutes) : 'Нет' }} ›</span></button>
<dialog ref="timeSheet" class="bp-time-sheet" aria-labelledby="bp-duration-title">
<header><h2 id="bp-duration-title">Продолжительность</h2><button class="bp-sheet-close" type="button" aria-label="Закрыть" @click="$refs.timeSheet.close()">×</button></header>
<div class="bp-pair"><fieldset v-for="unit in ['hours','mins']" :key="unit"><legend>{{unit==='hours' ? 'Часы' : 'Минуты'}}</legend><div class="bp-wheel">
<label v-for="i in (unit==='hours'?24:60)" :key="i"><input type="radio" :name="unit" :value="i-1" :checked="(unit==='hours'?hours:mins)===i-1" @change="unit==='hours' ? hours=i-1 : mins=i-1"><span>{{String(i-1).padStart(2,'0')}}</span></label>
</div></fieldset></div>
<button type="button" class="bp-signup-primary" @click="card.minutes = hours*60 + mins; $refs.timeSheet.close()">Готово</button></dialog>
<div class="bp-pair"><label>Цена<input v-model.trim="card.price" inputmode="decimal" pattern="[0-9]+([.,][0-9]{1,2})?" required placeholder="0,00"></label><div class="bp-currency-field"><span>Валюта</span><button type="button" aria-haspopup="dialog" @click="currencyQuery=''; $refs.currencySheet.showModal()">{{card.currency}} ⌄</button></div></div><dialog ref="currencySheet" class="bp-time-sheet" aria-labelledby="bp-currency-title"><header><h2 id="bp-currency-title">Валюта услуги</h2><button type="button" class="bp-sheet-close" aria-label="Закрыть" @click="$refs.currencySheet.close()">×</button></header>
<input v-model.trim="currencyQuery" type="search" @keydown.enter.prevent aria-label="Поиск валюты" placeholder="Валюта, код или страна">
<div class="bp-currency-list"><button type="button" v-for="entry in currencyMatches" :key="entry[0]" :aria-pressed="card.currency===entry[0]" @click="card.currency=entry[0]; $refs.currencySheet.close()"><span>{{entry[1]}}</span><b>{{entry[0]}}</b></button><p v-if="!currencyMatches.length">Валюта не найдена</p></div></dialog>
<label class="bp-switch"><span>Цена от</span><input type="checkbox" role="switch" v-model="card.from"><span class="bp-switch-track" aria-hidden="true"></span></label>
<button class="bp-signup-category" type="button" aria-haspopup="dialog" @click="openDiscount">{{ Number(card.discount) ? 'Скидка' : 'Добавить скидку' }} <span>{{ Number(card.discount) ? card.discount + (card.discountMode === 'amount' ? ' ' + card.currency : '%') : '+' }}</span></button>
<p v-if="Number(card.discount) && card.price">Цена со скидкой · {{ discountTotal(card.discount, card.discountMode) }} {{card.currency}}</p>
<dialog ref="discountSheet" class="bp-discount" aria-labelledby="bp-discount-title" @keydown="discountKeyboard">
<header><button type="button" aria-label="Назад" @click="$refs.discountSheet.close()">←</button><h2 id="bp-discount-title">Скидка</h2><button type="button" :disabled="!discountValid" @click="applyDiscount">Готово</button></header>
<div class="bp-discount-body"><output aria-live="polite">{{ discountDraft.replace('.', ',') }}{{ discountMode === 'amount' ? ' ' + card.currency : '%' }}</output>
<p v-if="!discountValid" role="alert">Скидка превышает цену услуги</p>
</div>
<div class="bp-discount-controls"><button class="bp-discount-mode" type="button" @click="switchDiscountMode">{{discountMode === 'amount' ? 'В процентах' : 'От цены'}}</button>
<div class="bp-discount-presets"><button type="button" v-for="n in [5,10,20,30,50]" :aria-pressed="discountMode==='percent' && Number(discountDraft)===n" @click="discountMode='percent'; discountDraft=String(n); discountReplace=true">{{n}}%</button></div>
<div class="bp-discount-pad"><button v-for="key in ['1','2','3','4','5','6','7','8','9',',','0','⌫']" type="button" :aria-label="key==='⌫' ? 'Удалить цифру' : key" @click="discountKey(key)">{{key}}</button></div></div></dialog>
<h2>Настройки услуги</h2><label class="bp-switch"><span>Доступна для онлайн-записи</span><input type="checkbox" role="switch" v-model="card.online"><span class="bp-switch-track" aria-hidden="true"></span></label>
<button type="button" class="bp-signup-category" aria-haspopup="dialog" @click="$refs.mediaSheet.showModal()">Фото и описание услуги <span aria-hidden="true">›</span></button>
<dialog ref="mediaSheet" class="bp-media" aria-labelledby="bp-media-title">
<header><button type="button" aria-label="Закрыть" @click="$refs.mediaSheet.close()">×</button><h2 id="bp-media-title">Фото и описание услуги</h2></header>
<div class="bp-media-content">
<textarea v-model="card.description" rows="5" aria-label="Описание услуги" placeholder="Описание услуги"></textarea>
<div class="bp-media-heading"><h3>Фотографии</h3></div>
<div class="bp-media-grid">
<div class="bp-media-thumb" v-for="(photo,index) in card.photos" :key="index"><img :src="photo" :alt="'Фото услуги '+(index+1)"><button type="button" :aria-label="'Удалить фото '+(index+1)" @click="card.photos.splice(index,1)">×</button></div>
<button class="bp-media-add" type="button" aria-label="Добавить фотографии" :disabled="photoBusy" @click="$refs.mediaInput.click()">{{ photoBusy ? '…' : '+' }}</button>
<input ref="mediaInput" hidden type="file" accept="image/*" multiple @change="cardPhoto">

<template v-for="(lw, $index) in v.lowList">
<div style="background: #FFFFFF; border: 1px solid #F3C9C2; border-radius: 16px; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9B2C20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{ lw.name }}</span><span style="font-size: 14px; color: #9B2C20">{{ lw.text }}</span></div></div>
<button type="button" @click="lw.refill" style="font-family: Lato, Arial, sans-serif; font-size: 14px; font-weight: 700; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 1px solid #1C6B30; background: #FFFFFF; color: #1C6B30; cursor: pointer">Купила +1 уп.</button>
</div>
</template>
<template v-if="v.noLow"><div style="background: #FFFFFF; border: 1px dashed #D8CDD3; border-radius: 16px; padding: 20px; color: #776A71">Всего хватает</div></template>
</section>
<section aria-label="Записи на завтра" style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Напомнить о записи завтра</h2>
<template v-for="(r, $index) in v.tomorrow">
<div style="background: #FFFFFF; border: 1px solid #EAE3E7; border-radius: 16px; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{ r.client }}</span><span style="font-size: 14px; color: #776A71">{{ r.time }} · {{ r.service }}</span></div>
<a :href="r.wa" target="_blank" rel="noopener" style="text-decoration: none; font-size: 14px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; background: #1C6B30; color: #FFFFFF">Написать в WhatsApp</a>
</div>
</template>
<template v-if="v.noTomorrow"><div style="background: #FFFFFF; border: 1px dashed #D8CDD3; border-radius: 16px; padding: 20px; color: #776A71">На завтра записей нет</div></template>
</section>
<section aria-label="Пора на повторный визит" style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Пора на повторный визит</h2>
<p style="margin: 0; font-size: 14px; color: #776A71">Клиенты, у которых подошёл срок коррекции и нет новой записи</p>
<template v-for="(r, $index) in v.dueList">
<div style="background: #FFFFFF; border: 1px solid #EAE3E7; border-radius: 16px; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{ r.client }}</span><span style="font-size: 14px; color: #776A71">{{ r.service }} · {{ r.ago }}</span></div>
<a :href="r.wa" target="_blank" rel="noopener" style="text-decoration: none; font-size: 14px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; background: #8E2F56; color: #FFFFFF">Пригласить</a>
</div>
</template>
<template v-if="v.noDue"><div style="background: #FFFFFF; border: 1px dashed #D8CDD3; border-radius: 16px; padding: 20px; color: #776A71">Сейчас приглашать некого</div></template>
</section>
</div>
</template>

<p style="margin: 32px 0 0; font-size: 13px; color: #776A71; text-align: center">Все изменения сохраняются автоматически</p>

<template v-if="v.addOpen">
<div role="dialog" aria-modal="true" aria-label="Свой материал" style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 90; background: rgba(48, 39, 45, 0.30); overflow-y: auto; padding: 40px 16px">
<div style="max-width: 440px; margin: 40px auto; background: #FFFFFF; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 3px 14px rgba(58, 38, 48, 0.045)">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<h2 style="margin: 0; font-family: Lato, Arial, sans-serif; font-weight: 700; font-size: 20px">Свой материал</h2>
<button type="button" aria-label="Закрыть" @click="v.libApi.addCancel" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: #F3E6EC; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#30272D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700"><span>Раздел</span>
<select :value="v.addCatV" @change="v.libApi.addCat" style="min-height: 46px; border-radius: 10px; border: 1px solid #D8CDD3; padding: 0 10px; font-size: 15px; background: #FFFDF8">
<template v-for="(o, $index) in v.libCatOpts"><option :value="o.v">{{ o.v }}</option></template>
</select>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700"><span>Название материала</span>
<input type="text" :value="v.addNameV" @input="v.libApi.addName" placeholder="Например: гель Sarkisian Clear" style="min-height: 46px; border-radius: 10px; border: 1px solid #D8CDD3; padding: 0 12px; font-size: 15px; background: #FFFDF8">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700"><span>Единица измерения</span>
<select :value="v.addUnitV" @change="v.libApi.addUnit" style="min-height: 46px; border-radius: 10px; border: 1px solid #D8CDD3; padding: 0 10px; font-size: 15px; background: #FFFDF8">
<template v-for="(u, $index) in v.units"><option :value="u.v">{{ u.v }}</option></template>
</select>
</label>
<template v-if="v.addIsPack">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700"><span>Сколько штук в одной упаковке?</span>
<input type="number" inputmode="decimal" :value="v.addPerV" @input="v.libApi.addPer" placeholder="Например: 100" style="min-height: 46px; border-radius: 10px; border: 1px solid #D8CDD3; padding: 0 12px; font-size: 15px; background: #FFFDF8">
</label>
</template>
<template v-if="v.addErr"><div style="color: #9B2C20; font-size: 14px; font-weight: 700">Впишите название материала</div></template>
<div style="display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap">
<button type="button" @click="v.libApi.addCancel" style="font-family: Lato, Arial, sans-serif; font-size: 15px; font-weight: 700; min-height: 48px; padding: 10px 20px; border-radius: 999px; border: 1px solid #D8CDD3; background: #FFFFFF; color: #30272D; cursor: pointer">Отмена</button>
<button type="button" @click="v.libApi.addSave" style="font-family: Lato, Arial, sans-serif; font-size: 15px; font-weight: 700; min-height: 48px; padding: 10px 24px; border-radius: 999px; border: none; background: #8E2F56; color: #FFFFFF; cursor: pointer">Добавить</button>
</div>
</div>
</div>
</template>
</main>
<template v-if="v.catOpen">
<div role="dialog" aria-modal="true" aria-label="Каталог материалов" style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 70; background: rgba(48, 39, 45, 0.30); overflow-y: auto; padding: 20px 12px">
<div style="max-width: 900px; margin: 12px auto; background: #FAF9F8; border-radius: 24px; display: flex; flex-direction: column; max-height: calc(100vh - 48px)">
<div style="padding: 22px 22px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #EAE3E7">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: Lato, Arial, sans-serif; font-weight: 700; font-size: 22px">Добавьте материалы</h2>
<p style="margin: 0; font-size: 14px; color: #554A50">Нажмите на всё, чем пользуетесь в этой услуге</p>
</div>
<button type="button" aria-label="Закрыть" @click="v.catClose" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: #F3E6EC; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#30272D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<input type="search" aria-label="Поиск материала" placeholder="Поиск: база, фреза, перчатки…" :value="v.catQ" @input="v.catSearch" style="min-height: 44px; border-radius: 999px; border: 1px solid #D8CDD3; padding: 0 16px; font-size: 15px; background: #FFFFFF">
</div>
<div style="padding: 16px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px">
<template v-for="(g, $index) in v.catGroups">
<template v-if="g.show">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; color: #6B1F40; text-transform: uppercase; letter-spacing: 0.05em">{{ g.title }}</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template v-for="(it, $index) in g.items">
<template v-if="it.on">
<button type="button" aria-pressed="true" @click="it.pick" style="font-family: Lato, Arial, sans-serif; font-size: 14px; font-weight: 700; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid #8E2F56; background: #8E2F56; color: #FFFFFF; cursor: pointer">✓ {{ it.name }}</button>
</template>
<template v-if="it.off">
<button type="button" aria-pressed="false" @click="it.pick" style="font-family: Lato, Arial, sans-serif; font-size: 14px; font-weight: 600; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid #E0D6DC; background: #FFFFFF; color: #30272D; cursor: pointer">{{ it.name }}</button>
</template>
<template v-if="it.has">
<span style="font-size: 14px; font-weight: 600; min-height: 40px; box-sizing: border-box; padding: 8px 14px; border-radius: 999px; border: 1px solid #CDE8D2; background: #EFF7EF; color: #1C6B30; display: inline-flex; align-items: center">{{ it.name }} · уже есть</span>
</template>
</template>
</div>
</div>
</template>
</template>
</div>
<div style="padding: 14px 22px 20px; border-top: 1px solid #EAE3E7; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
<button type="button" @click="v.catCustom" style="font-family: Lato, Arial, sans-serif; font-size: 15px; font-weight: 700; min-height: 44px; padding: 8px 4px; border: none; background: transparent; color: #8E2F56; text-decoration: underline; cursor: pointer">Нет в списке? Добавить свой</button>
<template v-if="v.catHas">
<button type="button" @click="v.catAdd" style="font-family: Lato, Arial, sans-serif; font-size: 16px; font-weight: 700; min-height: 50px; padding: 12px 26px; border-radius: 999px; border: none; background: #8E2F56; color: #FFFFFF; cursor: pointer">Добавить выбранные · {{ v.catCount }}</button>
</template>
<template v-if="v.catNone">
<button type="button" :disabled="true" style="font-family: Lato, Arial, sans-serif; font-size: 16px; font-weight: 700; min-height: 50px; padding: 12px 26px; border-radius: 999px; border: none; background: #E0D6DC; color: #776A71; cursor: not-allowed">Выберите материалы</button>
</template>
</div>
</div>
</div>
</template>
</div>
</script>

// Keep a single moving highlight behind each group of choices.
const glideGroups = new WeakMap();
const glideDirective = {
  mounted(group) {
    const marker = group.querySelector('.bp-selection-glide');
    function position(animate) {
      const selected = group.querySelector('button[aria-current="page"], button[aria-pressed="true"]');
      if (!selected || !group.offsetWidth) { group.removeAttribute('data-glide'); return; }
      const x = selected.offsetLeft, y = selected.offsetTop;
      marker.style.transition = animate && group.hasAttribute('data-glide') ? '' : 'none';
      marker.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      marker.style.width = selected.offsetWidth + 'px';
      marker.style.height = selected.offsetHeight + 'px';
      group.setAttribute('data-glide','');
    }
    const observer = new ResizeObserver(() => position(false));
    observer.observe(group);
    glideGroups.set(group,{ position, observer });
    position(false);
  },
  updated(group) { glideGroups.get(group)?.position(true); },
  unmounted(group) { glideGroups.get(group)?.observer.disconnect(); glideGroups.delete(group); }
};

  this.serviceEdit = service;
  this.card = Object.assign({minutes:0, price:'', currency:'TRY', online:true, discount:'', from:false, photo:'', description:''}, service.details);
  this.card.photos = Array.isArray(this.card.photos) ? this.card.photos.slice() : this.card.photo ? [this.card.photo] : [];
  this.mediaError = '';
  this.cardError = '';
  this.photoBusy = false;
  this.signupScroll();
};
root.methods.openDiscount = function() {
  this.discountDraft = String(this.card.discount || 0);
  this.discountMode = this.card.discountMode || 'percent';
  this.discountReplace = true;
  this.$refs.discountSheet.showModal();
};
root.methods.discountKey = function(key) {
  let value = this.discountReplace ? '0' : this.discountDraft;
  if (key === '⌫') value = value.slice(0,-1) || '0';
  else if (key === ',') { if (!value.includes('.')) value += '.'; }
  else value = value === '0' ? key : value + key;
  if (!/^\d{1,12}(\.\d{0,2})?$/.test(value) || (this.discountMode === 'percent' && Number(value)>100)) return;
  this.discountDraft = value;
  this.discountReplace = false;
};
root.methods.discountKeyboard = function(event) {
  if (event.ctrlKey || event.altKey || event.metaKey) return;
  const key = event.key;
  if (!/^[0-9.,]$/.test(key) && key !== 'Backspace' && key !== 'Delete') return;
  event.preventDefault();
  this.discountKey(key === '.' ? ',' : key.length > 1 ? '⌫' : key);
};
root.methods.switchDiscountMode = function() {
  const price = Number(String(this.card.price).replace(',', '.'));
  const amount = Number(this.discountDraft);
  const toAmount = this.discountMode === 'percent';
  this.discountDraft = String(Number((toAmount ? price * amount / 100 : price ? Math.min(100, amount * 100 / price) : 0).toFixed(2)) || 0);
  this.discountMode = toAmount ? 'amount' : 'percent';
  this.discountReplace = true;
};
root.methods.applyDiscount = function() {
  if (!this.discountValid) return;
  this.card.discount = Number(this.discountDraft) || '';
  this.card.discountMode = this.discountMode;
  this.cardError = '';
  this.$refs.discountSheet.close();
};
root.methods.discountTotal = function(discount,mode) {
  const price = Number(String(this.card.price).replace(',', '.'));
  const total = mode === 'amount' ? price - discount : price * (1-discount/100);
  return Math.max(0,total).toLocaleString('ru-RU',{maximumFractionDigits:2});
};
root.methods.finishCard = function(selected) {
  if (this.cabCardCb && selected) {
    if (this.card.discountMode === 'amount' && this.card.discount > Number(String(this.card.price).replace(',', '.'))) { this.cardError = 'Скидка превышает цену услуги'; return; }
    var det = Object.assign({}, this.card, {photo:this.card.photos[0] || '', price:String(this.card.price).replace(',', '.')});
    var cb = this.cabCardCb; this.cabCardCb = null; this.serviceEdit = null; this.card = null;
    try { cb(det); } catch (e) {}
    return;
  }
  if (selected && this.card.discountMode === 'amount' && this.card.discount > Number(String(this.card.price).replace(',', '.'))) {
    this.cardError = 'Скидка превышает цену услуги';
    return;
  }
  const service = this.serviceEdit;
  service.selected = selected;
  service.details = selected ? Object.assign({}, this.card, {photo:this.card.photos[0] || '', price:this.card.price.replace(',', '.')}) : null;
  if (!this.serviceOptions.includes(service) && selected) this.serviceOptions.push(service);
  this.serviceEdit = null;
  this.signupScroll();
};
async function encodeServicePhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const scale = Math.min(1, 800/Math.max(img.width,img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1,Math.round(img.width*scale));
    canvas.height = Math.max(1,Math.round(img.height*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',0.75);

  } finally { URL.revokeObjectURL(url); }
}
root.methods.cardPhoto = async function(event) {
  const files = Array.from(event.target.files), card = this.card;
  event.target.value = '';
  if (!files.length || this.photoBusy) return;
  this.photoBusy = true;
  this.mediaError = '';
  try {
    for (const file of files) {
      if (this.card !== card) break;
      try { card.photos.push(await encodeServicePhoto(file)); }
      catch (_) { if (this.card === card) this.mediaError = 'Не удалось открыть фото. Выберите изображение JPEG, PNG или WebP.'; }
    }
  } finally { if (this.card === card) this.photoBusy = false; }
};
root.methods.addService = function() {
  const name = this.serviceDraft.trim();
  if (!name) return;
  const existing = this.servicesFor(this.serviceCategory).find(option => option.name.toLowerCase() === name.toLowerCase());
  this.editCard(existing || { category:this.serviceCategory, name, selected:false });
  this.serviceDraft = '';
  this.addingService = false;
};
root.methods.signupToggle = function(category){var i=this.signupSelected.indexOf(category);if(i>=0)this.signupSelected.splice(i,1);else this.signupSelected.push(category);};
root.methods.signupAdd = function(){var name=this.signupCustom.trim();if(!name)return;var existing=this.signupCategories.find(function(c){return c.toLocaleLowerCase()===name.toLocaleLowerCase();});if(!existing){this.signupCategories.push(name);existing=name;}if(!this.signupSelected.includes(existing))this.signupSelected.push(existing);this.signupCustom='';this.signupAdding=false;};
root.methods.enterWelcomeDemo = function(){try{localStorage.setItem('beauty-profit-personal-demo-entered','1');}catch(e){}this.view='app';this.$nextTick(function(){window.scrollTo(0,0);});};
root.computed.planNote = function() { return ' · личная демоверсия'; };
root.methods.goCabinet = function() { this.enterWelcomeDemo(); };
root.methods.onPlan = function() { return true; };
root.methods.onDone = function(plan,spheres) {
  this.cab = {plan:plan || 'premium',spheres:spheres,data:(this.cab && this.cab.data) || {}};
  saveDemo(this.cab); this.appKey++; this.view='app';
};
root.methods.toSite = function() { if(this.cab) saveDemo(this.cab); this.view='landing'; this.mainKey++; this.$nextTick(function(){window.scrollTo(0,0);}); };
root.methods.logout = function() { if(this.cab)saveDemo(this.cab);try{localStorage.removeItem('beauty-profit-personal-demo-entered');}catch(e){}this.welcomeSlide=0;this.view='welcome';this.$nextTick(function(){window.scrollTo(0,0);}); };
root.methods.onAppState = function(state) {
  const cab = this.cab;
  if (!cab) return;
  const email = this.user && this.user.email;
  this.$watch(() => JSON.stringify(pick(state)), json => {
    if (this.cab !== cab) return;
    cab.data = JSON.parse(json);
    const accounts = bpAccounts();
    const account = accounts[email];
    let saved = saveDemo(cab);
    if (account) {
      account.cab = cab;
      saved = bpSaveAccounts(accounts) && saved;
    }
    this.saveMsg = saved ? 'Сохранено на этом устройстве' : 'Браузер не разрешил сохранение';
  });
};

window.BPC_APP = Vue.createApp(root).mount('#app');
})();
</script>
